# Production-ish stack for a single GCE VM: every service runs from a PRE-BUILT
# image pulled from a registry (no build contexts, so the other repos are not
# needed on the VM). Postgres and Redis run as containers with named volumes —
# swap them for Cloud SQL / Memorystore later by changing the two URLs below.
#
# The simulator is deliberately absent: it is local-only and streams from your
# laptop to this stack's public URL.
name: grafin-ai

x-db-url: &db_url postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scoring:
    image: ${GRAFIN_REGISTRY:?set GRAFIN_REGISTRY}/grafin-ai-scoring:${GRAFIN_TAG:-latest}
    restart: unless-stopped
    environment:
      GRAFIN_SCORING_TOKEN: ${GRAFIN_SCORING_TOKEN:?set GRAFIN_SCORING_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10
    # internal only — never published to the host

  backend:
    image: ${GRAFIN_REGISTRY}/grafin-ai-backend:${GRAFIN_TAG:-latest}
    restart: unless-stopped
    environment:
      GRAFIN_DATABASE_URL: *db_url
      GRAFIN_REDIS_URL: redis://redis:6379/0
      GRAFIN_JWT_SECRET: ${GRAFIN_JWT_SECRET:?set a >=32 char secret}
      GRAFIN_ENV: ${GRAFIN_ENV:-production}
      GRAFIN_SCORING_URL: http://scoring:8000
      GRAFIN_SCORING_TOKEN: ${GRAFIN_SCORING_TOKEN}
      GRAFIN_INGEST_TOKEN: ${GRAFIN_INGEST_TOKEN:?set GRAFIN_INGEST_TOKEN (>=16 chars)}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      scoring: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    # Published only if you want to hit the API directly; the dashboard proxies
    # /api and /api/v1/ws internally, so leaving this closed is the safer default.
    ports: ["${BACKEND_HOST_PORT:-127.0.0.1:8000}:8000"]

  ingest:
    image: ${GRAFIN_REGISTRY}/grafin-ai-ingest:${GRAFIN_TAG:-latest}
    environment:
      GRAFIN_DATABASE_URL: *db_url
      GRAFIN_DATA_DIR: /data
    volumes:
      - ${GRAFIN_DATA_HOST_DIR:-./data}:/data:ro
    depends_on:
      backend: { condition: service_healthy }   # backend entrypoint runs alembic first
    restart: "no"

  frontend:
    image: ${GRAFIN_REGISTRY}/grafin-ai-frontend:${GRAFIN_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${FRONTEND_HOST_PORT:-80}:8080"]

volumes:
  pgdata:
