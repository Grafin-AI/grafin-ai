[project]
name = "garda-ai-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
]

[project.scripts]
garda-ingest = "garda_ai_ingest.seed.run:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# One-shot batch job: the reference loader reads a local CSV once at startup, so the
# blocking `open()` in an async fn is intentional. ruff>=0.16 enabled ASYNC230 by default.
ignore = ["ASYNC230"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# asyncpg ships no py.typed marker, so mypy --strict reports import-untyped for it.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
