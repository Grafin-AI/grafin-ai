name: backend-ci
on: { push: { paths: ['garda-ai-backend/**'] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
        working-directory: garda-ai-backend
      - run: uv run ruff check garda_ai_backend/
        working-directory: garda-ai-backend
      - run: uv run pytest -q
        working-directory: garda-ai-backend
