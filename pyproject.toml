[project]
name = "garda-ai-training"
version = "0.1.0"
description = "Garda AI fraud-scorer training: Multi-GNN port, causal evaluation, model bundle export"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.11.*"
dependencies = [
  "torch==2.5.1",
  "torch_geometric==2.6.1",
  "pyg-lib==0.4.0; sys_platform == 'darwin'",
  "numpy>=2.0,<2.3",
  "polars==2.0.0",
  "pyarrow>=18",
  "scikit-learn>=1.5,<1.8",
  "mlflow-skinny==3.17.1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13",
]

[project.optional-dependencies]
cpu = ["torch==2.5.1", "pyg-lib==0.4.0; sys_platform == 'linux'"]
cu124 = ["torch==2.5.1", "pyg-lib==0.4.0; sys_platform == 'linux'"]

[project.scripts]
garda-train = "garda_training.cli:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["garda_training"]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu124", extra = "cu124", marker = "sys_platform == 'linux'" },
]
pyg-lib = [
  { url = "https://data.pyg.org/whl/torch-2.5.0%2Bcpu/pyg_lib-0.4.0%2Bpt25-cp311-cp311-macosx_14_0_universal2.whl", marker = "sys_platform == 'darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.5.0%2Bcpu/pyg_lib-0.4.0%2Bpt25cpu-cp311-cp311-linux_x86_64.whl", extra = "cpu", marker = "sys_platform == 'linux'" },
  { url = "https://data.pyg.org/whl/torch-2.5.0%2Bcu124/pyg_lib-0.4.0%2Bpt25cu124-cp311-cp311-linux_x86_64.whl", extra = "cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["garda_training/models/multignn.py", "tests/upstream_ref.py", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["garda_training"]
exclude = ["garda_training/models/multignn\\.py$"]

[[tool.mypy.overrides]]
module = ["torch_geometric.*", "sklearn.*", "mlflow.*", "pyg_lib.*", "garda_training.models.multignn"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
