name: grafin-ai

x-db-url: &db_url postgresql+asyncpg://${POSTGRES_USER:-grafin}:${POSTGRES_PASSWORD:-grafin}@postgres:5432/${POSTGRES_DB:-grafin}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grafin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grafin}
      POSTGRES_DB: ${POSTGRES_DB:-grafin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grafin}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scoring:
    build: { context: ../grafin-ai-scoring }
    environment:
      GRAFIN_SCORING_TOKEN: ${GRAFIN_SCORING_TOKEN:?set GRAFIN_SCORING_TOKEN}
      # label_replay (default) | precomputed (model scores from grafin-train export-scores)
      GRAFIN_SCORER: ${GRAFIN_SCORER:-label_replay}
      GRAFIN_SCORES_PATH: /scores/scores.csv
    volumes:
      # Only read when GRAFIN_SCORER=precomputed; a missing host dir is created empty.
      - ${GRAFIN_SCORES_HOST_DIR:-../grafin-ai-training/runs/current/scores}:/scores:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10
    # internal only — not published to the host

  backend:
    build: { context: ../grafin-ai-backend }
    environment:
      GRAFIN_DATABASE_URL: *db_url
      GRAFIN_REDIS_URL: redis://redis:6379/0
      GRAFIN_JWT_SECRET: ${GRAFIN_JWT_SECRET:?set a >=32 char secret}
      GRAFIN_ENV: ${GRAFIN_ENV:-production}
      GRAFIN_SCORING_URL: http://scoring:8000
      GRAFIN_SCORING_TOKEN: ${GRAFIN_SCORING_TOKEN:?set GRAFIN_SCORING_TOKEN}
      GRAFIN_INGEST_TOKEN: ${GRAFIN_INGEST_TOKEN:?set GRAFIN_INGEST_TOKEN (>=16 chars)}
      # LLM explanations: none | anthropic | gemini | ollama
      GRAFIN_LLM_PROVIDER: ${GRAFIN_LLM_PROVIDER:-none}
      GRAFIN_LLM_API_KEY: ${GRAFIN_LLM_API_KEY:-}
      GRAFIN_LLM_MODEL: ${GRAFIN_LLM_MODEL:-}
      GRAFIN_LLM_BASE_URL: ${GRAFIN_LLM_BASE_URL:-}
      GRAFIN_LLM_TIMEOUT_S: ${GRAFIN_LLM_TIMEOUT_S:-20}
      # Model card: set when real model scores are served (empty = "Simulated (Phase 1)")
      GRAFIN_MODEL_NAME: ${GRAFIN_MODEL_NAME:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      scoring: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    # Host port is configurable to avoid clashing with other local stacks.
    ports: ["${BACKEND_HOST_PORT:-8000}:8000"]

  ingest:
    build: { context: ../grafin-ai-ingest }
    environment:
      GRAFIN_DATABASE_URL: *db_url
      GRAFIN_DATA_DIR: /data
    volumes:
      - ${GRAFIN_DATA_HOST_DIR:-../grafin-ai-data/HI-Small-ID}:/data:ro
    depends_on:
      backend: { condition: service_healthy }   # backend entrypoint ran alembic upgrade -> schema exists
    restart: "no"

  frontend:
    build: { context: ../grafin-ai-dashboard-web }
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${FRONTEND_HOST_PORT:-8080}:8080"]

  sim:
    build: { context: ../grafin-ai-sim }
    profiles: ["sim"]
    environment:
      GRAFIN_INGEST_URL: http://backend:8000/api/v1/ingest
      GRAFIN_INGEST_TOKEN: ${GRAFIN_INGEST_TOKEN:?set GRAFIN_INGEST_TOKEN (>=16 chars)}
      GRAFIN_DATA_DIR: /data
      # Replay knobs — override in .env or with `docker compose run -e ...`.
      # GRAFIN_LIMIT is deliberately NOT defaulted here: an empty value would be
      # passed as "" and fail int|None parsing. Pass it with -e when you want it.
      GRAFIN_SKIP: ${GRAFIN_SKIP:-0}
      GRAFIN_BATCH_SIZE: ${GRAFIN_BATCH_SIZE:-100}
      GRAFIN_SPEED: ${GRAFIN_SPEED:-60}
      GRAFIN_MAX_GAP_S: ${GRAFIN_MAX_GAP_S:-2.0}
    volumes:
      - ${GRAFIN_DATA_HOST_DIR:-../grafin-ai-data/HI-Small-ID}:/data:ro
    depends_on:
      backend: { condition: service_healthy }
      scoring: { condition: service_started }
      ingest: { condition: service_completed_successfully }

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    ports: ["3000:3000"]

volumes:
  pgdata:
