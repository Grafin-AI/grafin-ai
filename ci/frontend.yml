name: frontend-ci
on: { push: { paths: ['garda-ai-dashboard-web/**'] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: garda-ai-dashboard-web
      - run: npm test
        working-directory: garda-ai-dashboard-web
      - run: npm run build
        working-directory: garda-ai-dashboard-web
