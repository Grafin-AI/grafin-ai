[project]
name = "grafin-ai-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
]

[project.scripts]
grafin-sim = "grafin_ai_sim.run:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin to ruff's classic default ruleset. Newer ruff (0.16.x) expanded its implicit
# default to include flake8-comprehensions (e.g. C408); pinning keeps lint behaviour
# stable and matches the plan's intent.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
